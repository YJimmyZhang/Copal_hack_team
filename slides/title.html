<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Title slide, 1920x1080, navy section style. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#003768;--navy-2:#00284d;--blue:#009fdf;--blue-2:#4fc3f7;--muted:#b8cde0}
body{width:1920px;height:1080px;color:#fff;font-family:"Nunito Sans",Inter,"DejaVu Sans",sans-serif;position:relative;overflow:hidden;
  background:radial-gradient(circle at 74% 52%,#0b4d8a 0%,var(--navy) 40%,var(--navy-2) 100%)}

.logo{position:absolute;left:120px;top:84px;width:120px}
.text{position:absolute;left:120px;top:50%;transform:translateY(-46%);width:900px}
.kicker{font-size:26px;font-weight:800;letter-spacing:.18em;color:var(--blue-2)}
h1{font-size:150px;font-weight:900;line-height:.98;letter-spacing:-.02em;margin-top:16px}
h1 span{color:var(--blue-2)}
.rule{width:150px;height:10px;border-radius:5px;background:var(--blue);margin:40px 0 34px}
.claim{font-size:46px;font-weight:800;line-height:1.2}
.sub{font-size:30px;color:var(--muted);margin-top:16px;line-height:1.35}
.sub b{color:#fff}
.foot{position:absolute;left:120px;right:120px;bottom:64px;display:flex;justify-content:space-between;font-size:22px;color:#9fbbd4;font-weight:600}

svg.eco{position:absolute;right:110px;top:150px;width:780px;height:780px}
</style></head><body>

<img class="logo" src="kbc-logo-white.svg" alt="KBC">

<div class="text">
  <div class="kicker">KBC CASE · ENTREPRENEURSHIP</div>
  <h1>KBC Next<br><span>Owner</span></h1>
  <div class="rule"></div>
  <div class="claim">Every healthy company<br>deserves a next owner.</div>
  <div class="sub">KBC finds, prepares and finances them,<br><b>before the owner asks.</b></div>
</div>

<!-- Abstract ecosystem: KBC hub, owner -> next owner handover arc, partners on the outer ring -->
<svg class="eco" viewBox="0 0 760 760" fill="none">
  <defs>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#4fc3f7"/></linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4fc3f7"/></marker>
    <radialGradient id="glow"><stop offset="0" stop-color="#4fc3f7" stop-opacity=".35"/><stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="380" cy="380" r="200" fill="url(#glow)"/>
  <!-- orbits -->
  <circle cx="380" cy="380" r="150" stroke="rgba(79,195,247,.35)" stroke-width="2"/>
  <circle cx="380" cy="380" r="250" stroke="rgba(79,195,247,.25)" stroke-width="2" stroke-dasharray="3 10"/>
  <circle cx="380" cy="380" r="340" stroke="rgba(79,195,247,.15)" stroke-width="2"/>
  <g fill="#4fc3f7"><circle cx="486" cy="274" r="5"/><circle cx="254" cy="300" r="4" opacity=".7"/><circle cx="300" cy="516" r="5" opacity=".8"/><circle cx="500" cy="470" r="4" opacity=".6"/></g>
  <!-- partner links -->
  <g stroke="rgba(184,205,224,.35)" stroke-width="2" stroke-dasharray="6 8">
    <line x1="380" y1="380" x2="140" y2="140"/><line x1="380" y1="380" x2="620" y2="140"/>
    <line x1="380" y1="380" x2="140" y2="620"/><line x1="380" y1="380" x2="620" y2="620"/>
  </g>
  <g stroke="rgba(255,255,255,.5)" stroke-width="3"><line x1="192" y1="380" x2="285" y2="380"/><line x1="475" y1="380" x2="568" y2="380"/></g>
  <!-- handover arc -->
  <path d="M150 310 A250 250 0 0 1 610 310" stroke="url(#arc)" stroke-width="7" stroke-linecap="round" marker-end="url(#head)"/>
  <!-- KBC hub -->
  <circle cx="380" cy="380" r="95" fill="#00284d" stroke="#4fc3f7" stroke-width="5"/>
  <image href="kbc-logo-white.svg" x="318" y="330" width="124" height="102"/>
  <!-- owner and next owner -->
  <circle cx="130" cy="380" r="62" fill="#ffffff"/>
  <g stroke="#003768" stroke-width="3.5" stroke-linecap="round" fill="none"><circle cx="130" cy="366" r="15"/><path d="M102 408c4-16 15-23 28-23s24 7 28 23"/></g>
  <circle cx="630" cy="380" r="62" fill="#009fdf"/>
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"><circle cx="630" cy="366" r="15"/><path d="M602 408c4-16 15-23 28-23s24 7 28 23"/></g>
  <circle cx="672" cy="338" r="16" fill="#ffffff"/><path d="M664 338l6 6 10-11" stroke="#009fdf" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Nunito Sans,sans-serif" font-size="26" font-weight="800" text-anchor="middle">
    <text x="130" y="478" fill="#ffffff">Owner</text><text x="630" y="478" fill="#4fc3f7">Next owner</text>
  </g>
  <!-- partners: headhunters, schools, financing, insurance -->
  <g fill="rgba(255,255,255,.1)" stroke="rgba(79,195,247,.6)" stroke-width="2">
    <circle cx="140" cy="140" r="40"/><circle cx="620" cy="140" r="40"/><circle cx="140" cy="620" r="40"/><circle cx="620" cy="620" r="40"/>
  </g>
  <g stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="136" cy="136" r="13"/><path d="M146 146l10 10"/>
    <path d="M620 124l22 11-22 11-22-11z"/><path d="M607 141v10c7 6 19 6 26 0v-10"/>
    <circle cx="140" cy="620" r="17"/><path d="M147 612a9 9 0 1 0 0 16M130 617h11M130 623h11"/>
    <path d="M620 600l17 6v12c0 10-8 17-17 21-9-4-17-11-17-21v-12z"/><path d="M613 619l5 5 9-10"/>
  </g>
</svg>

<div class="foot"><span>KBC Next Owner · [Team name] · Tectonic finals, 20 October 2026</span><span>Next Owner</span></div>
</body></html>
