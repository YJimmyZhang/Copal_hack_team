<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Title slide, 1920x1080, navy section style. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#003768;--navy-2:#00284d;--blue:#009fdf;--blue-2:#4fc3f7;--muted:#b8cde0}
body{width:1920px;height:1080px;color:#fff;font-family:"Nunito Sans",Inter,"DejaVu Sans",sans-serif;position:relative;overflow:hidden;
  background:radial-gradient(circle at 74% 52%,#0b4d8a 0%,var(--navy) 40%,var(--navy-2) 100%)}

.logo{position:absolute;left:120px;top:84px;width:120px}
.text{position:absolute;left:120px;top:50%;transform:translateY(-46%);width:900px}
.kicker{font-size:26px;font-weight:800;letter-spacing:.18em;color:var(--blue-2)}
h1{font-size:150px;font-weight:900;line-height:.98;letter-spacing:-.02em;margin-top:16px}
h1 span{color:var(--blue-2)}
.rule{width:150px;height:10px;border-radius:5px;background:var(--blue);margin:40px 0 34px}
.claim{font-size:46px;font-weight:800;line-height:1.2}
.sub{font-size:30px;color:var(--muted);margin-top:16px;line-height:1.35}
.sub b{color:#fff}
.foot{position:absolute;left:120px;right:120px;bottom:64px;display:flex;justify-content:space-between;font-size:22px;color:#9fbbd4;font-weight:600}

svg.shop{position:absolute;right:100px;top:120px;width:770px;height:838px}
</style></head><body>

<img class="logo" src="kbc-logo-white.svg" alt="KBC">

<div class="text">
  <div class="kicker">KBC CASE · ENTREPRENEURSHIP</div>
  <h1>KBC Next<br><span>Owner</span></h1>
  <div class="rule"></div>
  <div class="claim">Every healthy company<br>deserves a next owner.</div>
  <div class="sub">KBC finds, prepares and finances them,<br><b>before the owner asks.</b></div>
</div>

<!-- A healthy industrial SME: production hall + office wing, loading door closed, sign: who takes over? -->
<svg class="shop" viewBox="0 0 680 740" fill="none">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f8fb"/><stop offset="1" stop-color="#d9e5ee"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d5b86"/><stop offset="1" stop-color="#1d4166"/></linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a0"/><stop offset="1" stop-color="#f5bd55"/></linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f8daa"/><stop offset="1" stop-color="#4a6a8a"/></linearGradient>
  </defs>
  <ellipse cx="340" cy="712" rx="335" ry="20" fill="#000" opacity=".25"/>
  <!-- production hall with sawtooth roof -->
  <path d="M30 300 L30 236 L120 186 L120 236 L210 186 L210 236 L300 186 L300 236 L390 186 L390 236 L450 203 V300 Z" fill="#c9d8e5"/>
  <g fill="#9fd8f3"><path d="M120 186 L120 236 L106 236 Z" opacity=".0"/></g>
  <g stroke="#a9bccd" stroke-width="3"><path d="M120 186V236M210 186V236M300 186V236M390 186V236"/></g>
  <g fill="#4fc3f7" opacity=".55"><path d="M112 192 L120 188 L120 236 L112 236 Z"/><path d="M202 192 L210 188 L210 236 L202 236 Z"/><path d="M292 192 L300 188 L300 236 L292 236 Z"/><path d="M382 192 L390 188 L390 236 L382 236 Z"/></g>
  <rect x="30" y="236" width="420" height="474" fill="url(#wall)"/>
  <rect x="30" y="236" width="420" height="16" fill="#b9cbdb"/>
  <!-- company band -->
  <rect x="70" y="282" width="340" height="56" rx="6" fill="#003768"/>
  <circle cx="104" cy="310" r="15" fill="#009fdf"/>
  <text x="132" y="319" font-family="Nunito Sans,sans-serif" font-size="25" font-weight="900" fill="#fff" letter-spacing="5">EST. 1979</text>
  <!-- loading door, closed -->
  <rect x="80" y="380" width="320" height="330" rx="4" fill="url(#door)"/>
  <g stroke="#3d5d7d" stroke-width="3">
    <line x1="80" y1="420" x2="400" y2="420"/><line x1="80" y1="460" x2="400" y2="460"/><line x1="80" y1="500" x2="400" y2="500"/>
    <line x1="80" y1="540" x2="400" y2="540"/><line x1="80" y1="580" x2="400" y2="580"/><line x1="80" y1="620" x2="400" y2="620"/><line x1="80" y1="660" x2="400" y2="660"/>
  </g>
  <rect x="80" y="380" width="320" height="330" rx="4" stroke="#9fb4c7" stroke-width="8"/>
  <!-- office wing with lit windows -->
  <rect x="450" y="300" width="210" height="410" fill="#e8eff5"/>
  <rect x="450" y="290" width="210" height="16" fill="#b9cbdb"/>
  <g>
    <rect x="474" y="330" width="70" height="78" rx="3" fill="url(#lit)"/><rect x="566" y="330" width="70" height="78" rx="3" fill="url(#glass)"/>
    <rect x="474" y="430" width="70" height="78" rx="3" fill="url(#glass)"/><rect x="566" y="430" width="70" height="78" rx="3" fill="url(#lit)"/>
    <rect x="474" y="530" width="70" height="78" rx="3" fill="url(#lit)"/><rect x="566" y="530" width="70" height="78" rx="3" fill="url(#glass)"/>
  </g>
  <rect x="520" y="632" width="70" height="78" rx="3" fill="url(#glass)"/>
  <rect x="510" y="624" width="90" height="8" fill="#003768"/>
  <!-- hanging sign on the door -->
  <g stroke="#ffffff" stroke-width="3"><line x1="160" y1="386" x2="125" y2="498"/><line x1="320" y1="386" x2="355" y2="498"/></g>
  <circle cx="160" cy="386" r="5" fill="#fff"/><circle cx="320" cy="386" r="5" fill="#fff"/>
  <g transform="rotate(-3 240 540)">
    <rect x="60" y="494" width="360" height="96" rx="14" fill="#ffffff" stroke="#009fdf" stroke-width="5"/>
    <text x="240" y="554" text-anchor="middle" font-family="Nunito Sans,sans-serif" font-size="36" font-weight="900" fill="#003768">Who takes over?</text>
  </g>
</svg>

<div class="foot"><span>KBC Next Owner · [Team name] · Tectonic finals, 20 October 2026</span><span>Next Owner</span></div>
</body></html>
